plugins { id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" }
version = project.mod_version
group = 'interium'
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modCompileOnly files("libs/vfp-api.jar")
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release = 21 }
java { withSourcesJar() }
jar {
    from('vendor/ViaFabricPlus-4.4.15.jar') { into 'META-INF/jars' }
    from('LICENSE') { rename { 'LICENSE_Interium' } }
    from('third-party') { into 'THIRD_PARTY_NOTICES' }
}
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
test { failOnNoDiscoveredTests = false }
tasks.register('coreChecks', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'interium.core.CoreTest'
}
check.dependsOn coreChecks

// Diagnostic bytecode check, not a substitute for a game launch.
tasks.register('visualTargetChecks') {
 dependsOn compileJava
 doLast {
  def javaHome=javaToolchains.launcherFor { languageVersion=JavaLanguageVersion.of(21) }.get().metadata.installationPath.asFile
  def classes=['net.minecraft.client.render.item.HeldItemRenderer','net.minecraft.client.render.entity.ItemEntityRenderer','net.minecraft.client.render.GameRenderer']
  classes.each { name ->
   def proc=new ProcessBuilder(new File(javaHome,'bin/javap').absolutePath,'-classpath',sourceSets.main.compileClasspath.asPath,'-c','-p',name).redirectErrorStream(true).start()
   def text=proc.inputStream.text
   if(proc.waitFor()!=0)throw new GradleException(text)
   def path=file("build/visual-targets/"+name.tokenize('.').last()+'.txt');path.parentFile.mkdirs();path.text=text
   if(name.endsWith('HeldItemRenderer')) {
    def first=text.indexOf('private void renderFirstPersonItem(')
    def end=text.indexOf('private void swingArm(',first)
    def body=text.substring(first,end)
    int count=body.readLines().count { it.contains('invoke')&&it.contains('Method swingArm:') }
    println('Visual target check: renderFirstPersonItem swingArm calls='+count)
    if(count<3)throw new GradleException('Delta swing ordinal=2 unavailable; inspect named bytecode')
   }
   if(name.endsWith('ItemEntityRenderer'))println('Visual target check: item renderer bytecode captured')
  }
 }
}
check.dependsOn visualTargetChecks

// Opt-in CI GUI launch. This does not run in distributed clients.
loom { runs { client { if(System.getenv('INTERIUM_SMOKE')=='1') { vmArg '-Dinterium.deltaProbe=true'; vmArg '-Dinterium.visualSmoke=true' } } } }
tasks.register('visualApiDump') {
 dependsOn compileJava
 doLast {
  def home=javaToolchains.launcherFor { languageVersion=JavaLanguageVersion.of(21) }.get().metadata.installationPath.asFile
  def names=['com.mojang.blaze3d.systems.RenderSystem','com.mojang.blaze3d.systems.CommandEncoder','com.mojang.blaze3d.systems.RenderPass','com.mojang.blaze3d.systems.GpuDevice','com.mojang.blaze3d.buffers.GpuBuffer','com.mojang.blaze3d.textures.GpuTexture','net.minecraft.client.gl.Framebuffer','net.minecraft.client.gl.SimpleFramebuffer','net.minecraft.client.render.VertexFormats','net.minecraft.client.gui.render.state.GuiRenderState','net.minecraft.client.gui.render.state.SimpleGuiElementRenderState','net.minecraft.client.gui.render.state.ColoredQuadGuiElementRenderState','net.minecraft.client.texture.TextureSetup','net.minecraft.client.render.GameRenderer','net.minecraft.client.gui.DrawContext$ScissorStack','net.minecraft.client.render.entity.state.EntityRenderState']
  def output=new StringBuilder()
  names.each { name ->
   def p=new ProcessBuilder(new File(home,'bin/javap').absolutePath,'-classpath',sourceSets.main.compileClasspath.asPath,'-p',name).redirectErrorStream(true).start()
   def text=p.inputStream.text;p.waitFor();output.append('\n=== '+name+' ===\n'+text)
  }
  def file=file('build/visual-api.txt');file.parentFile.mkdirs();file.text=output.toString()
 }
}

tasks.register('visualNumericalChecks',JavaExec){dependsOn testClasses;classpath=sourceSets.test.runtimeClasspath;mainClass='interium.core.VisualMathTest'}
check.dependsOn visualNumericalChecks

// Original Interium logo generated without downloaded assets or native donor libraries.
tasks.register('generateInteriumLogo') {
 def target=layout.buildDirectory.file('generated/interium/assets/interium/textures/logo.png')
 outputs.file(target)
 doLast {
  def image=new java.awt.image.BufferedImage(64,64,java.awt.image.BufferedImage.TYPE_INT_ARGB)
  def g=image.createGraphics();g.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING,java.awt.RenderingHints.VALUE_ANTIALIAS_ON)
  def poly={xs,ys,color -> g.setColor(new java.awt.Color(color as int,true));g.fillPolygon(xs as int[],ys as int[],xs.size())}
  poly([32,58,58,32,6,6],[2,17,47,62,47,17],0xff11101b)
  poly([32,55,55,32,9,9],[5,18,46,59,46,18],0xffa07ef9)
  poly([32,51,51,32,13,13],[10,21,43,54,43,21],0xff161423)
  poly([20,44,40,36,36,42,46,18,22,28,28,24],[18,18,25,25,39,39,46,46,39,39,25,25],0xffeae2ff)
  poly([36,40,44,36],[25,25,18,18],0xff7eb7ff)
  poly([18,46,42,28],[46,46,39,39],0xffab89ff)
  g.dispose();def out=target.get().asFile;out.parentFile.mkdirs();javax.imageio.ImageIO.write(image,'png',out)
 }
}
sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/interium'))
processResources.dependsOn 'generateInteriumLogo'
tasks.named('sourcesJar'){dependsOn 'generateInteriumLogo'}
tasks.register('modulePolicyChecks',JavaExec){dependsOn testClasses;classpath=sourceSets.test.runtimeClasspath;mainClass='interium.core.ModuleMathTest'}
check.dependsOn modulePolicyChecks
