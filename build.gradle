plugins { id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" }
version = project.mod_version
group = 'interium'
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modCompileOnly files("libs/vfp-api.jar")
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release = 21 }
java { withSourcesJar() }
jar {
    from('vendor/ViaFabricPlus-4.4.15.jar') { into 'META-INF/jars' }
    from('LICENSE') { rename { 'LICENSE_Interium' } }
    from('third-party') { into 'THIRD_PARTY_NOTICES' }
}
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
test { failOnNoDiscoveredTests = false }
tasks.register('coreChecks', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'interium.core.CoreTest'
}
check.dependsOn coreChecks

// Diagnostic bytecode check, not a substitute for a game launch.
tasks.register('visualTargetChecks') {
 dependsOn compileJava
 doLast {
  def javaHome=javaToolchains.launcherFor { languageVersion=JavaLanguageVersion.of(21) }.get().metadata.installationPath.asFile
  def classes=['net.minecraft.client.render.item.HeldItemRenderer','net.minecraft.client.render.entity.ItemEntityRenderer']
  classes.each { name ->
   def proc=new ProcessBuilder(new File(javaHome,'bin/javap').absolutePath,'-classpath',sourceSets.main.compileClasspath.asPath,'-c','-p',name).redirectErrorStream(true).start()
   def text=proc.inputStream.text
   if(proc.waitFor()!=0)throw new GradleException(text)
   def path=file("build/visual-targets/"+name.tokenize('.').last()+'.txt');path.parentFile.mkdirs();path.text=text
   if(name.endsWith('HeldItemRenderer')) {
    def first=text.indexOf('private void renderFirstPersonItem(')
    def end=text.indexOf('private void swingArm(',first)
    def body=text.substring(first,end)
    int count=body.readLines().count { it.contains('invoke')&&it.contains('Method swingArm:') }
    println('Visual target check: renderFirstPersonItem swingArm calls='+count)
    if(count<3)throw new GradleException('Delta swing ordinal=2 unavailable; inspect named bytecode')
   }
   if(name.endsWith('ItemEntityRenderer'))println('Visual target check: item renderer bytecode captured')
  }
 }
}
check.dependsOn visualTargetChecks
