name: Build Interium
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: interium-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 21 toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Save Java 21 location
        run: echo "JAVA21_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Install Java 25 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Restore and verify binary files
        run: python3 tools/restore_binaries.py
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Prepare verified bundled dependency
        run: python3 tools/prepare_vendor.py
      - name: Compile, run checks and remap JAR
        shell: bash
        run: |
          set -o pipefail
          bash ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Verify remapped JAR and bundled dependency
        run: python3 tools/verify_build.py
      - name: Capture local named rendering API signatures
        run: bash ./gradlew visualApiDump --no-daemon
      - name: Launch title and Delta GUI under software OpenGL
        env:
          INTERIUM_SMOKE: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        shell: bash
        run: |
          set -o pipefail
          if ! command -v xvfb-run >/dev/null; then sudo apt-get update && sudo apt-get install -y xvfb; fi
          timeout 420s xvfb-run -a -s "-screen 0 1280x720x24" bash ./gradlew runClient --no-daemon --args="--username InteriumSmoke --width 960 --height 540" 2>&1 | tee smoke.log
          grep -F 'INTERIUM_GUI_SMOKE_PASSED' smoke.log
      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Interium-build-${{ github.run_number }}
          path: |
            build.log
            smoke.log
            build/visual-api.txt
            build/libs/*.jar
            build/verification.json
            build/SHA256SUMS
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish build feedback and successful experimental binaries
        if: always()
        uses: actions/github-script@v7
        env:
          BUILD_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner, repo = context.repo.repo;
            const run = context.runId;
            const result = {status: process.env.BUILD_STATUS, run_id: run, sha: context.sha, url: 'https:' + '//github.com/' + owner + '/' + repo + '/actions/runs/' + run, release: null};
            if (result.status === 'success') {
              const tag = `experimental-${run}`;
              const rel = await github.rest.repos.createRelease({owner, repo, tag_name: tag, target_commitish: context.sha, name: `Interium experimental build ${run}`, prerelease: true, body: 'Compiled work-in-progress for Fabric 1.21.11. Title/Delta GUI launch checked in software OpenGL; world rendering is NOT game-tested. Includes source and third-party notices. Not the lost 0.6.0 source branch.'});
              result.release = rel.data.html_url;
              for (const name of fs.readdirSync('build/libs').filter(n => n.endsWith('.jar'))) {
                const data = fs.readFileSync(`build/libs/${name}`);
                await github.rest.repos.uploadReleaseAsset({owner, repo, release_id: rel.data.id, name, data, headers: {'content-type': 'application/java-archive','content-length': data.length}});
              }
            }
            for (const name of ['verification.json','SHA256SUMS']) {
              if (result.status === 'success' && fs.existsSync('build/' + name)) {
                const rel = await github.rest.repos.getReleaseByTag({owner,repo,tag:'experimental-' + run});
                const data = fs.readFileSync('build/' + name);
                await github.rest.repos.uploadReleaseAsset({owner,repo,release_id:rel.data.id,name,data,headers:{'content-type':'application/octet-stream','content-length':data.length}});
              }
            }
            for (const [path, text] of [['build-feedback/latest.json', JSON.stringify(result, null, 2)], ['build-feedback/smoke.log', fs.existsSync('smoke.log') ? fs.readFileSync('smoke.log','utf8').slice(-600000) : 'Not started'], ['build-feedback/visual-api.txt', fs.existsSync('build/visual-api.txt') ? fs.readFileSync('build/visual-api.txt','utf8').slice(-600000) : 'Not generated'], ['build-feedback/build.log', fs.existsSync('build.log') ? fs.readFileSync('build.log','utf8').slice(-600000) : 'Build failed before Gradle; see Actions run.']]) {
              let sha;
              try { sha = (await github.rest.repos.getContent({owner,repo,path,ref:'main'})).data.sha; } catch(e) { if(e.status !== 404) throw e; }
              await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',message:'Save build feedback [skip ci]',content:Buffer.from(text).toString('base64'),...(sha ? {sha} : {})});
            }
